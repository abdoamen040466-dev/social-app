<section class="ms-4 my-3">
  <div class="">
    <div class="flex justify-between items-center">
      <div class="flex gap-2 my-1 items-center">
        <img [src]="comment.commentCreator.photo || '/default-profile.png'" class="w-8" alt="" />
        <p class="font-bold">{{ comment.commentCreator.name }}</p>
      </div>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
    <div class="">
      <p class="font-medium px-10 ms-4">{{ comment.content }}</p>
    </div>
    <div class="ms-10 flex gap-2 mt-1">
      <button type="button" class="cursor-pointer">Like</button>
      <span>|</span>
      <button type="button" class="cursor-pointer">Reply</button>
    </div>
  </div>
  <div class=""></div>
</section>
