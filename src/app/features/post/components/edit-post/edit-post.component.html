<div class="bg-mainColor rounded-2xl p-4">
  <!-- Body -->
  <textarea
    [formControl]="body"
    class="max-h-40 resize-none border-0 bg-transparent rounded-2xl w-full text-[17px] focus:ring-0 p-3 text-gray-600 placeholder:text-gray-400"
  ></textarea>

  <!-- Image Preview -->
  @if (imagePreview) {
    <div class="w-fit mx-auto flex flex-col items-center gap-3 mt-3">
      <img [src]="imagePreview" class="w-64 max-h-80 object-cover rounded-xl" alt="Post image" />

      <button
        type="button"
        (click)="deleteImage()"
        class="bg-red-600 px-4 py-2 text-white rounded-xl cursor-pointer"
      >
        Delete Image
      </button>
    </div>
  }

  <!-- Options -->
  <div class="flex justify-between items-center mt-4">
    <!-- Left -->
    <div class="flex items-center gap-5">
      <!-- Image -->
      <label for="postImage" class="flex items-center gap-2 cursor-pointer hover:text-blue-600">
        <i class="fa-solid fa-image"></i>
        <span>
          {{ post.image ? 'Change Photo' : 'Photo' }}
        </span>
      </label>

      <input
        #fileInput
        (change)="onFileSelected($event)"
        id="postImage"
        type="file"
        accept="image/*"
        hidden
      />

      <!-- Privacy -->
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-earth-americas"></i>

        <select [formControl]="privacy" class="border-0 bg-transparent focus:ring-0 cursor-pointer">
          <option value="public">Public</option>
          <option value="following">Followers</option>
          <option value="only_me">Only Me</option>
        </select>
      </div>
    </div>

    <!-- Buttons -->
    <div class="flex gap-2">
      <button
        (click)="cancelEdit()"
        type="button"
        class="bg-yellow-600 px-4 py-2 text-white rounded-xl cursor-pointer"
      >
        Cancel
      </button>

      <button
        (click)="editPost()"
        type="button"
        class="bg-blue-600 px-4 py-2 text-white flex items-center gap-2 rounded-xl cursor-pointer"
      >
        <span>Save</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>
