<div class="flex justify-between items-center">
  <app-post-likes-component
    [post]="post"
    [showLikesUser]="showLikesUser"
  ></app-post-likes-component>
  <div class="flex gap-2 items-center">
    <p class="font-light text-gray-600">{{ post.sharesCount }} shares</p>
    @if (post.commentsCount > 0) {
      <button
        (click)="getAllComments(post._id)"
        (click)="showCreateComment()"
        class="font-light text-gray-600 cursor-pointer"
      >
        {{ post.commentsCount }} comments
      </button>
    } @else {
      <p class="font-light text-gray-600 cursor-pointer" (click)="showCreateComment()">
        {{ post.commentsCount }} comments
      </p>
    }
    <p (click)="goToDetails()" class="text-blue-600 font-medium cursor-pointer">view details</p>
  </div>
</div>
@if (createCommentflag) {
  <app-create-comment (newComment)="addNewComment($event)" [post]="post"></app-create-comment>
}
@if (post.commentsCount > 0 && commentsVisible()) {
  @for (item of comments(); track item._id) {
    <app-comment
      (deletedComment)="deleteComment($event)"
      (UpdatedComment)="updateComment($event)"
      (ReplyComment)="ShowReply($event)"
      [comment]="item"
      [post]="post"
    ></app-comment>
    @if (item.repliesCount > 0) {
      <div class="ms-10 border-s">
        <app-reply-comment [post]="post" [comment]="item" [reply]="reply"></app-reply-comment>
      </div>
    }
  }
}
