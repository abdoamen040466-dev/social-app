<section
  class="w-full mt-4 bg-neutral-primary-soft mx-auto border-default rounded-base shadow-xs p-6"
  [class.max-w-4xl]="!fullWidth"
  [class.max-w-7xl]="fullWidth"
>
  <div class="">
    <app-post-header
      (postDeleted)="SendDeletedPostId($event)"
      [post]="post!"
      [isShared]="true"
    ></app-post-header>
  </div>
  <div>
    @if (!post.sharedPost) {
      <app-post [post]="post" [footerFlag]="false" [fullWidth]="fullWidth"></app-post>
    } @else {
      <app-post [post]="post.sharedPost" [footerFlag]="false" [fullWidth]="fullWidth"></app-post>
    }
  </div>
  <div class="">
    <app-post-footer [post]="post"></app-post-footer>
  </div>
</section>
