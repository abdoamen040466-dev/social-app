<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
  <div class="relative w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl">
    <!-- Close Button -->
    <button
      type="button"
      (click)="closeModal()"
      class="absolute right-4 top-4 flex h-8 w-8 items-center justify-center rounded-full bg-slate-100 text-slate-600 transition hover:bg-slate-200"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>

    <!-- Title -->
    <h2 class="mb-5 text-center text-xl font-bold text-slate-900">Change Profile Photo</h2>

    <div
      [class]="
        imagePreview
          ? 'flex flex-col md:flex-row gap-8 items-center justify-center'
          : 'flex flex-col items-center'
      "
    >
      <div>
        <!-- Current Photo -->
        <div class="flex justify-center">
          <div class="h-40 w-40 overflow-hidden rounded-full border-4 border-slate-200 shadow-md">
            <img
              [src]="user.photo || 'assets/default-profile.png'"
              alt="Profile photo"
              class="h-full w-full object-cover"
            />
          </div>
        </div>

        <!-- Upload -->
        <div class="mt-6">
          <label for="photo" class="mb-2 block text-sm font-semibold text-slate-700">
            Upload Your Photo
          </label>

          <input
            #fileInput
            (change)="onFileSelected($event)"
            id="photo"
            type="file"
            accept="image/*"
            class="block w-full cursor-pointer rounded-lg border border-slate-300 bg-slate-50 text-sm text-slate-500"
          />
        </div>
      </div>

      <div>
        <!-- Image Preview -->
        @if (imagePreview) {
          <div class="w-48 max-w-fit m-auto mt-4 flex flex-col items-center">
            <img [src]="imagePreview" alt="" />
            <div
              class="py-2 px-4 mt-2 bg-blue-600 w-fit rounded-xl text-white cursor-pointer"
              (click)="uploadProfilePhoto()"
            >
              <p>Upload Image</p>
            </div>
            <div
              class="py-2 px-4 mt-2 bg-red-600 w-fit rounded-xl text-white cursor-pointer"
              (click)="deleteImage()"
            >
              <p>Delete Image</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</div>
